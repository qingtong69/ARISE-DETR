task: detection
evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']
num_classes: 45
remap_mscoco_category: False
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: data/tt100k_45/images
    ann_file: data/tt100k_45/annotations/train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: data/tt100k_45/images
    ann_file: data/tt100k_45/annotations/val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn: BatchImageCollateFunction
