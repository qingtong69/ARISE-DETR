__include__: [
  '../dataset/visdrone_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dfine_hgnetv2.yml',
]

output_dir: ./output/arise_base
num_classes: 10

DFINE:
  backbone: HGNetv2P2P5
  encoder: ARISEEncoder

HGNetv2P2P5:
  name: 'B2'
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: True
  local_model_dir: weight/hgnetv2/

ARISEEncoder:
  in_channels: [96, 384, 768, 1536]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [3]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'
  expansion: 0.5
  depth_mult: 0.67
  act: 'silu'
  bio_ratio: 0.5
  dy_groups: 4

DFINETransformer:
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  dim_feedforward: 1024
  num_levels: 4
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 3, 6, 3]
  cross_attn_method: default
  query_select_method: default

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*(?:norm|bn)).*$'
      lr: 0.00002
    -
      params: '^(?=.*backbone)(?=.*(?:norm|bn)).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 160
train_dataloader:
  total_batch_size: 4
  dataset:
    transforms:
      policy:
        epoch: 148
  collate_fn:
    stop_epoch: 148
    ema_restart_decay: 0.9999
    base_size_repeat: 6
val_dataloader:
  total_batch_size: 4

use_amp: True
