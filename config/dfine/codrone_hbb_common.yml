task: detection
num_classes: 12
remap_mscoco_category: false
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
eval_spatial_size:
- 640
- 640
epochs: 160
checkpoint_freq: 50
use_amp: true
use_ema: true
use_wandb: false
num_visualization_sample_batch: 0
optimizer:
  type: AdamW
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
  params:
  - params: ^(?=.*backbone)(?!.*(?:norm|bn)).*$
    lr: 1.0e-05
  - params: ^(?=.*backbone)(?=.*(?:norm|bn)).*$
    lr: 1.0e-05
    weight_decay: 0.0
  - params: ^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$
    weight_decay: 0.0
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 128
  - 152
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
train_dataloader:
  type: DataLoader
  total_batch_size: 8
  num_workers: 4
  shuffle: true
  drop_last: true
  dataset:
    type: CocoDetection
    img_folder: data/CODrone/train/images
    ann_file: data/CODrone/annotations_hbb/codrone_train_hbb.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomHorizontalFlip
        p: 0.5
      - type: Resize
        size:
        - 640
        - 640
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch: 148
        ops: []
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    stop_epoch: 148
val_dataloader:
  type: DataLoader
  total_batch_size: 8
  num_workers: 4
  shuffle: false
  drop_last: false
  dataset:
    type: CocoDetection
    img_folder: data/CODrone/val/images
    ann_file: data/CODrone/annotations_hbb/codrone_val_hbb.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
      policy:
        name: stop_epoch
        epoch: 160
        ops: []
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    stop_epoch: 160
