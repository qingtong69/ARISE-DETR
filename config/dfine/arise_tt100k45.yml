__include__: [
  '../dataset/tt100k_45_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dfine_hgnetv2.yml',
]
output_dir: ./output/arise_tt100k45
num_classes: 45
checkpoint_freq: 10

DFINE:
  backbone: HGNetv2P2P5
  encoder: ARISEEncoder

HGNetv2P2P5:
  name: 'B2'
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: True
  local_model_dir: weight/hgnetv2/

ARISEEncoder:
  in_channels: [96, 384, 768, 1536]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [3]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: gelu
  expansion: 0.5
  depth_mult: 0.67
  act: silu
  bio_ratio: 0.5
  dy_groups: 4

DFINETransformer:
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  num_levels: 4
  num_layers: 4
  num_queries: 300
  eval_idx: -1
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 3, 6, 3]
  cross_attn_method: default
  query_select_method: default

epochs: 160
train_dataloader:
  total_batch_size: 4
  dataset:
    transforms:
      policy:
        epoch: 148
  collate_fn:
    stop_epoch: 148
val_dataloader:
  total_batch_size: 4
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
use_amp: True

heldout_annotations: data/tt100k_45/annotations/test.json
